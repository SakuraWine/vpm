<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sakura-iro Wine Cellar</title>
  <meta name="description" content="SakuraWine の VRChat 向けツールの VPM リポジトリです。">
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --card: #ffffff;
      --text: #2b2226;
      --muted: #7a6a70;
      --border: #eadde2;
      --wine: #8e2b46;
      --wine-hover: #73203a;
      --sakura: #f4c6d3;
      --code-bg: #f6f0f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
      line-height: 1.7;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 16px 64px;
    }
    header { text-align: center; margin-bottom: 40px; }
    .logo { font-size: 44px; line-height: 1; }
    h1 { margin: 12px 0 4px; font-size: 32px; letter-spacing: 0.02em; }
    .tagline { margin: 0; color: var(--muted); }
    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }
    h2 { margin: 0 0 12px; font-size: 18px; }
    .buttons { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0; }
    .btn {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 8px;
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--wine);
    }
    .btn-primary { background: var(--wine); color: #fff; }
    .btn-primary:hover { background: var(--wine-hover); border-color: var(--wine-hover); }
    .btn-secondary { background: transparent; color: var(--wine); }
    .btn-secondary:hover { background: var(--sakura); }
    code.url {
      display: block;
      padding: 10px 12px;
      background: var(--code-bg);
      border-radius: 8px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
    .note { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
    .package {
      padding: 16px 0;
      border-top: 1px solid var(--border);
    }
    .package:first-of-type { border-top: none; padding-top: 0; }
    .package-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
    .package-name { font-weight: 700; font-size: 17px; }
    .version {
      font-size: 13px;
      padding: 1px 8px;
      border-radius: 999px;
      background: var(--sakura);
    }
    .package-id { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .package p { margin: 6px 0 0; }
    a { color: var(--wine); }
    footer { text-align: center; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="logo" aria-hidden="true">🍷🌸</div>
      <h1>Sakura-iro Wine Cellar</h1>
      <p class="tagline">SakuraWine の VRChat 向けツールの VPM リポジトリです</p>
    </header>

    <section>
      <h2>リポジトリを追加する</h2>
      <div class="buttons">
        <a class="btn btn-primary" href="vcc://vpm/addRepo?url=https://sakurawine.github.io/vpm/index.json">VCC / ALCOM に追加</a>
        <button class="btn btn-secondary" type="button" id="copy">URL をコピー</button>
      </div>
      <code class="url" id="repo-url">https://sakurawine.github.io/vpm/index.json</code>
      <p class="note">
        ボタンで起動しない場合は、URL をコピーして VCC / ALCOM の設定画面からリポジトリを追加してください。
      </p>
    </section>

    <section>
      <h2>パッケージ</h2>
      <div id="packages"><p class="note">読み込み中…</p></div>
    </section>

    <footer>
      <a href="https://github.com/SakuraWine">GitHub</a>
    </footer>
  </main>

  <script>
    // URL をクリップボードにコピー
    const copyButton = document.getElementById("copy");
    copyButton.addEventListener("click", async () => {
      const url = document.getElementById("repo-url").textContent;
      try {
        await navigator.clipboard.writeText(url);
        copyButton.textContent = "コピーしました";
      } catch {
        copyButton.textContent = "コピーできませんでした";
      }
      setTimeout(() => (copyButton.textContent = "URL をコピー"), 2000);
    });

    // バージョン文字列を数値の配列にして比較する（"0.10.0" > "0.9.0" になるように）
    const parseVersion = (v) => v.split(/[.-]/).map((n) => parseInt(n, 10) || 0);
    const compareVersion = (a, b) => {
      const pa = parseVersion(a), pb = parseVersion(b);
      for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
        const d = (pa[i] || 0) - (pb[i] || 0);
        if (d !== 0) return d;
      }
      return 0;
    };

    // index.json からパッケージ一覧を作る（パッケージを追加してもこのページは書き換え不要）
    const list = document.getElementById("packages");
    fetch("index.json", { cache: "no-cache" })
      .then((res) => res.json())
      .then((repo) => {
        list.textContent = "";
        for (const [id, entry] of Object.entries(repo.packages)) {
          const versions = Object.keys(entry.versions).sort(compareVersion);
          const latest = entry.versions[versions[versions.length - 1]];

          const item = document.createElement("div");
          item.className = "package";

          const head = document.createElement("div");
          head.className = "package-head";
          const name = document.createElement("span");
          name.className = "package-name";
          name.textContent = latest.displayName || id;
          const version = document.createElement("span");
          version.className = "version";
          version.textContent = "v" + latest.version;
          head.append(name, version);

          const pkgId = document.createElement("div");
          pkgId.className = "package-id";
          pkgId.textContent = id;

          const desc = document.createElement("p");
          desc.textContent = latest.description || "";

          item.append(head, pkgId, desc);

          const docUrl = latest.documentationUrl;
          if (docUrl) {
            const link = document.createElement("p");
            const a = document.createElement("a");
            a.href = docUrl;
            a.textContent = "詳細・使い方";
            link.append(a);
            item.append(link);
          }

          list.append(item);
        }
      })
      .catch(() => {
        list.innerHTML = '<p class="note">パッケージ一覧を読み込めませんでした。</p>';
      });
  </script>
</body>
</html>
